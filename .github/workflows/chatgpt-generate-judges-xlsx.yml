name: Package validated judges workbook

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install workbook validator
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Extract the valid XLSX package
        shell: bash
        run: |
          rm -rf xlsx_payload
          mkdir xlsx_payload
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from openpyxl import load_workbook

          source = Path('tmp/chatgpt-output/photon_judges_russell_kant.xlsx')
          assert source.exists(), source
          assert source.read_bytes()[:4] == b'PK\x03\x04'
          with zipfile.ZipFile(source, 'r') as archive:
              assert archive.testzip() is None
              archive.extractall('xlsx_payload')
          workbook = load_workbook(source, read_only=False, data_only=False)
          sheet = workbook['评委问答收集表']
          assert sheet['A13'].value == 'Russell'
          assert sheet['A14'].value == 'Kant'
          assert (sheet['B14'].value, sheet['D14'].value, sheet['F14'].value) == ('Q1', 'Q3', 'Q4')
          workbook.close()
          PY

      - name: Upload package whose ZIP is itself a valid XLSX
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: photon-judges-russell-kant-valid-xlsx
          path: xlsx_payload/**
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Download and validate the exact artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            curl -L --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              -o exact_download.xlsx && break
            sleep 2
          done
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from openpyxl import load_workbook

          candidate = Path('exact_download.xlsx')
          assert candidate.exists() and candidate.stat().st_size > 1000
          assert candidate.read_bytes()[:4] == b'PK\x03\x04'
          required = {'[Content_Types].xml', '_rels/.rels', 'xl/workbook.xml', 'xl/worksheets/sheet1.xml'}
          with zipfile.ZipFile(candidate, 'r') as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              missing = required - names
              assert not missing, f'artifact ZIP is not a root-level XLSX package; missing {sorted(missing)}; first entries={sorted(names)[:20]}'
          workbook = load_workbook(candidate, read_only=False, data_only=False)
          assert workbook.sheetnames == ['评委问答收集表']
          sheet = workbook['评委问答收集表']
          assert sheet['A13'].value == 'Russell'
          assert sheet['A14'].value == 'Kant'
          assert (sheet['B14'].value, sheet['D14'].value, sheet['F14'].value) == ('Q1', 'Q3', 'Q4')
          workbook.close()
          print(f'Exact downloadable artifact validated as XLSX: {candidate.stat().st_size} bytes')
          PY
